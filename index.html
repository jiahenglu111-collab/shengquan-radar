<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >
  <meta name="theme-color" content="#ff6b35">
  <meta name="description" content="省券雷达：全平台优惠券查询与比价助手">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>省券雷达</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">

  <style>
    :root {
      --brand: #ff6b35;
      --brand-dark: #e64a19;
      --brand-light: #fff1e8;
      --bg: #f5f6fa;
      --card: #ffffff;
      --text: #202124;
      --muted: #727780;
      --line: #e9eaee;
      --warning-bg: #fff7e6;
      --warning: #8a5100;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Microsoft YaHei", sans-serif;
      padding-bottom: calc(28px + env(safe-area-inset-bottom));
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding:
        calc(12px + env(safe-area-inset-top))
        16px 12px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      color: white;
      font-weight: 800;
      background: linear-gradient(135deg, #ff5a26, #ff9a4d);
      box-shadow: 0 6px 16px rgba(255, 107, 53, 0.25);
    }

    .brand strong {
      display: block;
      font-size: 18px;
    }

    .brand small {
      color: var(--muted);
    }

    main {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: 16px;
    }

    .hero {
      padding: 24px 20px;
      color: white;
      border-radius: 24px;
      background:
        radial-gradient(circle at 90% 0%, rgba(255,255,255,.24), transparent 34%),
        linear-gradient(135deg, #ff5a26, #ff9848);
      box-shadow: 0 12px 28px rgba(255, 107, 53, 0.22);
    }

    .hero .tag {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.2);
      font-size: 12px;
    }

    .hero h1 {
      margin: 13px 0 8px;
      font-size: 26px;
    }

    .hero p {
      margin: 0;
      line-height: 1.6;
      opacity: 0.92;
    }

    .card {
      margin-top: 16px;
      padding: 17px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 5px 18px rgba(27, 31, 36, 0.04);
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      min-height: 116px;
      resize: vertical;
      padding: 14px;
      color: var(--text);
      background: #f7f8fa;
      border: 1px solid transparent;
      border-radius: 14px;
      outline: none;
      line-height: 1.55;
    }

    textarea:focus {
      background: white;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(255,107,53,.12);
    }

    .actions {
      display: grid;
      grid-template-columns: 0.8fr 1.2fr;
      gap: 10px;
      margin-top: 12px;
    }

    .button {
      min-height: 46px;
      padding: 10px 15px;
      border: 0;
      border-radius: 13px;
      font-weight: 700;
    }

    .button:active {
      transform: scale(.98);
    }

    .primary {
      color: white;
      background: var(--brand);
    }

    .secondary {
      color: var(--brand-dark);
      background: var(--brand-light);
    }

    .outline {
      color: var(--text);
      background: white;
      border: 1px solid var(--line);
    }

    .install {
      min-height: 36px;
      padding: 7px 12px;
      color: var(--brand-dark);
      background: var(--brand-light);
      border: 0;
      border-radius: 12px;
      font-weight: 700;
    }

    .platform {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .platform-icon {
      width: 50px;
      height: 50px;
      flex: 0 0 50px;
      display: grid;
      place-items: center;
      color: var(--brand-dark);
      background: var(--brand-light);
      border-radius: 16px;
      font-size: 23px;
    }

    .platform-info {
      min-width: 0;
      flex: 1;
    }

    .platform-info strong {
      display: block;
      font-size: 17px;
    }

    .platform-info span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .warning {
      display: flex;
      gap: 9px;
      margin-top: 12px;
      padding: 13px;
      color: var(--warning);
      background: var(--warning-bg);
      border: 1px solid #ffd591;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.55;
    }

    .offer {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-top: 12px;
      padding: 14px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 16px;
    }

    .amount {
      width: 76px;
      height: 76px;
      flex: 0 0 76px;
      display: grid;
      place-content: center;
      text-align: center;
      color: var(--brand-dark);
      background: var(--brand-light);
      border-radius: 16px;
    }

    .amount strong {
      font-size: 22px;
    }

    .amount small {
      margin-top: 3px;
      font-size: 11px;
    }

    .offer-detail {
      min-width: 0;
      flex: 1;
    }

    .offer-detail strong {
      display: block;
    }

    .offer-detail span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .result-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 17px;
    }

    .text-button {
      padding: 5px;
      color: var(--muted);
      background: transparent;
      border: 0;
    }

    .saved-list {
      display: grid;
      gap: 9px;
      margin-top: 12px;
    }

      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px;
      background: #f8f9fb;
      border-
